<template id="privacySettings">
  <form>
    <label>Link privacy <select name="visibility">
      <option value="private">Private</option>
      <option value="password">Password</option>
      <option value="unlisted">Unlisted</option>
      <option value="public">Public</option>
      <option value="embed_only">Embed only</option>
    </select></label>
    <label>Viewer password <input name="password" type="password" maxlength="256" autocomplete="new-password"></label>
    <label>Embedding <select name="embed">
      <option value="disabled">Off</option><option value="anywhere">Anywhere</option>
      <option value="domains">Specific domains</option>
    </select></label>
    <label>Allowed embed domains <textarea name="domains" rows="3"></textarea></label>
    <label><input type="checkbox" name="download"> Allow viewers to download</label>
    <button type="submit">Save privacy</button>
  </form>
  <div data-privacy-links></div>
</template>

<template id="groupPlaybackSettings">
  <section class="group-playback" aria-labelledby="group-playback-title">
    <h2 id="group-playback-title">Group playback</h2>
    <p>Choose a group whose viewers can play this video without entering its password.</p>
    <p class="group-playback-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <form class="group-playback-form" aria-label="Group playback access">
      <label>Group slug
        <input name="group" type="text" required maxlength="64" autocomplete="off" spellcheck="false" />
      </label>
      <label><input type="checkbox" name="public_group"> Allow anyone in this public group to play the video</label>
      <button type="submit">Add access</button>
    </form>
    <ul class="group-playback-list" aria-label="Group playback grants"></ul>
  </section>
</template>
