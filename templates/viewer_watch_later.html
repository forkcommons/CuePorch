<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }} · CuePorch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='cueporch.css') }}">
</head>
<body class="watch-catalog">
  {% include "viewer_watch_nav.html" %}
  <main>
    <h1>{{ title }}</h1>
    {% if signed_in %}
      {% include "viewer_saved_grid.html" %}
    {% else %}
      <p><a href="{{ url_for('viewer_account_page') }}">Sign in to see your {{ title }} list</a></p>
    {% endif %}
  </main>
</body>
</html>
