<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/cueporch.css">
<title>{{ title }} · CuePorch team</title>
<main>
  <nav aria-label="Team"><a href="/team">Team workspace</a></nav>
  <h1>{{ title }}</h1>
  {% if details %}<p><a href="{{ details }}">Edit video details</a></p>{% endif %}
  <video controls controlslist="nodownload" playsinline preload="metadata" aria-label="{{ title }}" src="{{ media }}"></video>
</main>
</html>
