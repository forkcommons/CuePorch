<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/cueporch.css">
  <title>Analytics · CuePorch</title>
</head>
<body>
  <nav aria-label="Operator"><a href="/operator/library">Library</a></nav>
  <h1>Analytics</h1>
  <form id="reportIdentity">
    <label>Operator credential <input id="reportKey" type="password" autocomplete="current-password" required></label>
    <button>Open analytics</button>
  </form>
  <p id="reportStatus" role="status"></p>
  <main id="analyticsDashboard" hidden>
    <form id="reportControls">
      <fieldset>
        <legend>Filters</legend>
        <div class="library-tools">
          <label>Date range <select name="dates">
            <option value="30">Last 30 days</option><option value="7">Last 7 days</option>
            <option value="90">Last 90 days</option><option value="">Custom</option>
          </select></label>
          <label>From (UTC) <input type="date" name="from" required></label>
          <label>To (UTC) <input type="date" name="to" required></label>
          <label>Playback surface <select name="surface">
            <option value="">All</option><option value="watch">Watch page</option><option value="embed">Embed</option>
          </select></label>
          <label>Device <select name="device">
            <option value="">All</option><option>Desktop</option><option>Phone</option><option>Tablet</option>
            <option>TV</option><option>Unknown</option>
          </select></label>
          <label>Referring site <input name="source" maxlength="270" placeholder="https://example.org"></label>
        </div>
        <details id="reportContent">
          <summary id="reportSelection">All videos</summary>
          <label>Search library videos <input id="reportSearch" type="search"></label>
          <label for="reportVideos">Videos</label>
          <select id="reportVideos" multiple size="7" aria-describedby="reportVideoHelp"></select>
          <p id="reportVideoHelp">Select up to 10,000 videos. Clear the selection to report across the library.</p>
          <button id="clearVideos" type="button">Clear selection</button>
        </details>
      </fieldset>
      <fieldset>
        <legend>Report</legend>
        <div class="library-tools">
          <label>Group by <select name="group"></select></label>
          <label>Break down by <select name="breakdown"></select></label>
          <label>Time scale <select name="period">
            <option value="day">Day</option><option value="week">Week</option>
            <option value="month">Month</option><option value="year">Year</option>
          </select></label>
          <button type="submit">Apply filters</button>
          <button id="downloadReport" type="button">Download CSV</button>
        </div>
      </fieldset>
    </form>
    <dl id="reportTotals" class="analytics-counts"></dl>
    <section aria-labelledby="trendHeading">
      <h2 id="trendHeading">Overview over time</h2>
      <label>Metric <select id="trendMetric"></select></label>
      <div class="analytics-table">
        <table><thead><tr><th scope="col">Period starting (UTC)</th><th scope="col">Value</th></tr></thead>
          <tbody id="reportTrend"></tbody></table>
      </div>
    </section>
    <section aria-labelledby="reportRowsTitle">
      <h2 id="reportRowsTitle">Breakdown</h2>
      <p id="reportEmpty" hidden>No playback observations match these filters.</p>
      <div class="analytics-table">
        <table><thead><tr id="reportColumns"></tr></thead><tbody id="reportRows"></tbody></table>
      </div>
    </section>
  </main>
  <script type="module" src="/static/ui/analytics_dashboard.js"></script>
</body>
</html>
