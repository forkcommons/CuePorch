<!doctype html><html lang="en"><meta charset="utf-8"><link rel="stylesheet" href="/static/cueporch.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit a work</title>
        {% include "workspace_mark.html" %}<h1>Submit a work</h1>
        <form id="submission"><label>Creator credential <input id="access" type="password" required></label>
        <label>Title <input name="title" required></label><label>Credits <input name="credits"></label>
        <label>Description <textarea name="description"></textarea></label><label>Master <input type="file" name="master" id="master" required></label>
        <video id="preview" aria-label="Private local preview" controls hidden></video><label>English captions <input type="file" name="caption" accept=".vtt"></label>
        <label>Poster <input type="file" name="poster" accept="image/jpeg,image/png"></label>
        <label>Trailer <input type="file" name="trailer" accept="video/*"></label>
        <label><input type="checkbox" name="public_trailer"> Authorize public viewing and embedding of this trailer</label>
        <label>Viewing terms <select name="terms"><option value="private">Private screening</option>
        <option value="public">Public viewing and embedding authorized</option></select></label><label>Publication time (local; blank for immediate delivery)<input id="releaseTime" type="datetime-local"></label><button>Submit</button></form>
        <p id="message" role="status"></p><script type="module" src="/static/ui/submission_form.js"></script></html>
