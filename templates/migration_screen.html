<!doctype html><html lang="en"><meta charset="utf-8"><link rel="stylesheet" href="/static/cueporch.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Move from Vimeo · CuePorch</title>
        <main><h1>Move from Vimeo</h1><form><label>Operator credential <input type="password" id="key"></label>
        <label>Vimeo account owner token <input type="password" id="source"></label>
        <button type="button" id="inventory">Preview transfer</button><button type="button" id="transfer">Transfer privately</button>
        </form><p role="status" id="status"></p><table><thead><tr><th>Work</th><th>Source ID</th><th>Recovery</th><th>Viewing permission</th>
        </tr></thead><tbody id="rows"></tbody></table></main><script>
        const headers=()=>({Authorization:'Bearer '+key.value,'Content-Type':'application/json'});
        async function run(dry){const r=await fetch('/api/migration',{method:'POST',headers:headers(),
        body:JSON.stringify({dry_run:dry,token:source.value})});if(!r.ok){statusBox.textContent='Request failed ('+r.status+')';return}poll();}
        const statusBox=document.getElementById('status');async function poll(){const r=await fetch('/api/migration',{headers:headers()});
        if(!r.ok)return;const data=await r.json();statusBox.textContent=data.state+(data.detail?' · '+data.detail:'');
        rows.replaceChildren();for(const w of data.works||[]){const row=rows.insertRow();
        for(const v of [w.title,w.source_id,w.disposition,w.source_privacy])row.insertCell().textContent=v;}
        if(['running','waiting'].includes(data.state))setTimeout(poll,750);}
        inventory.onclick=()=>run(true);transfer.onclick=()=>run(false);</script></html>
