<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Library · CuePorch</title>
  <link rel="stylesheet" href="/static/cueporch.css">
</head>
<body>
  <nav aria-label="Operator">
    <a href="/operator">Operator console</a> · <a href="/operator/migration">Move from Vimeo</a>
  </nav>
  <h1>Library</h1>
  <label>Operator credential <input type="password" id="key"></label>
  <button id="load" type="button">Load library</button>
  <button id="exportMap" type="button">Download embed map</button>
  <button id="publishImports" type="button">Publish eligible Vimeo imports</button>
  <p id="result" role="status"></p>

  <div class="library-layout" id="library" hidden>
    <aside>
      <nav id="folderTree" aria-label="Folders"></nav>
      <button type="button" id="newFolder">New folder</button>
      <button type="button" id="editFolder" hidden>Edit folder</button>
      <button type="button" id="starFolder" hidden>Star folder</button>
      <button type="button" id="deleteFolder" hidden>Delete folder</button>
    </aside>
    <section aria-labelledby="folderTitle">
      <h2 id="folderTitle">Library</h2>
      <div id="workBrowse">
      <div class="library-tools">
        <label>Search titles <input id="search" type="search"></label>
        <label>Source privacy <select id="privacy"><option value="">All</option></select></label>
        <label>Created by <input id="creator" type="search" list="creators"></label>
        <datalist id="creators"></datalist>
        <label>Sort <select id="sort">
          <option value="title">Title A to Z</option><option value="title-desc">Title Z to A</option>
          <option value="added-desc">Last added</option><option value="added">First added</option>
          <option value="modified-desc">Last modified</option><option value="modified">First modified</option>
          <option value="long">Longest</option><option value="short">Shortest</option>
        </select></label>
        <label>View <select id="view"><option value="list">List</option><option value="grid">Grid</option></select></label>
      </div>
      <div class="library-tools">
        <label>Destination <select id="destination" disabled></select></label>
        <button type="button" id="move" disabled>Move selected</button>
        <button type="button" id="deleteWorks" disabled>Delete selected</button>
      </div>
      <p id="empty" hidden>No works in this view.</p>
      <table id="workTable">
        <thead><tr><th scope="col">Select</th><th scope="col">Work</th><th scope="col">Source privacy</th>
        <th scope="col">Recovery</th><th scope="col">Delivery</th><th scope="col">Actions</th></tr></thead>
        <tbody id="items"></tbody>
      </table>
      </div>
      <div id="trashBrowse" hidden>
        <p>Items can be restored for 30 days.</p>
        <div class="library-tools">
          <label>Type <select id="trashType"><option value="">All</option><option value="work">Works</option><option value="folder">Folders</option></select></label>
          <label>Deleted by <input id="trashActor" type="search"></label>
          <button type="button" id="refreshTrash">Refresh</button>
        </div>
        <p id="trashEmpty" hidden>No recently deleted items match.</p>
        <table id="trashTable">
          <thead><tr><th scope="col">Item</th><th scope="col">Type</th><th scope="col">Deleted by</th>
          <th scope="col">Deleted on</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead>
          <tbody id="trashItems"></tbody>
        </table>
      </div>
    </section>
  </div>

  <dialog id="folderEditor" aria-labelledby="folderEditorTitle">
    <form id="folderForm">
      <h2 id="folderEditorTitle">New folder</h2>
      <label>Folder name <input id="folderName" maxlength="32" required></label>
      <label>Folder color <input id="folderColor" type="color" value="#164e5a"></label>
      <label>Parent folder <select id="folderParent"></select></label>
      <p id="folderError" role="alert"></p>
      <div><button type="submit" id="saveFolder">Save folder</button><button type="button" id="cancelFolder">Cancel</button></div>
    </form>
  </dialog>

  <script type="module" src="/static/ui/library_console.js"></script>
</body>
</html>
