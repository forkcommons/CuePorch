<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Continue to Event Series · CuePorch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='cueporch.css') }}">
</head>
<body class="live-event-page">
  <main id="eventLobby">
    <h1>Continue to Event Series</h1>

    </form>
  </main>
</body>
</html>
