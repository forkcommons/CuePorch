<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Protected event · CuePorch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='cueporch.css') }}">
</head>
<body class="live-event-page">
  <main id="eventLobby">
    <h1>Protected event</h1>
    <form method="post">
      {% if incorrect %}<p role="alert">That event password is incorrect.</p>{% endif %}
      {% if unlock_token %}<input type="hidden" name="frame" value="{{ unlock_token }}">{% endif %}
      <label>Event password <input type="password" name="password" maxlength="256" autocomplete="current-password" required></label>
      <button type="submit">Unlock event</button>
    </form>
  </main>
</body>
</html>
