<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/cueporch.css">
  <title>Timeline editor · CuePorch</title>
</head>
<body data-work="{{ work }}">
  {% include "operator_navigation.html" %}
  <nav aria-label="Operator">
    <a href="/operator/videos/{{ work }}">Video details</a>
    <a href="/operator/videos/{{ work }}/editing">Trim and GIF</a>
    <a href="/operator/record">Record Studio</a>
  </nav>
  <h1>Timeline editor</h1>
  <form id="timelineIdentity">
    <label>Operator credential <input id="timelineKey" type="password" autocomplete="current-password" required></label>
    <button type="submit">Open timeline</button>
  </form>
  <p id="timelineStatus" role="status"></p>
  <main id="timelineStudio" hidden>
    <div class="video-work-actions">
      <button id="undoTimeline" type="button">Undo</button>
      <button id="redoTimeline" type="button">Redo</button>
      <button id="saveTimeline" type="button">Save draft</button>
      <button id="renderTimeline" type="button">Render as a new version</button>
      <button id="discardTimeline" type="button">Reset draft</button>
    </div>
    <p id="timelineRecovery" hidden>Opened your saved draft.</p>
    <div class="video-workspace">
      <section aria-labelledby="timelinePreviewTitle">
        <h2 id="timelinePreviewTitle">Preview</h2>
        <div id="timelinePreviewCanvas" class="timeline-preview-canvas">
          <video id="timelinePreview" controls playsinline hidden aria-label="Timeline source video"></video>
          <div id="timelineCardPreview" hidden></div>
          <img id="timelineGraphicPreview" alt="" hidden>
        </div>
        <p id="timelineSourceName"></p>
        <div class="video-work-actions">
          <button id="splitTimeline" type="button" disabled>Split at preview time</button>
          <button id="playTimelineClip" type="button" disabled>Play selected clip</button>
        </div>
      </section>
      <aside aria-label="Timeline settings">
        <fieldset>
          <legend>Canvas</legend>
          <label>Aspect ratio <select id="timelineRatio">
            <option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option>
          </select></label>
          <label>Background color <input type="color" id="timelineColor"></label>
        </fieldset>
        <fieldset>
          <legend>Graphics</legend>
          <label for="timelineGraphicSearch">Find graphic</label>
          <input id="timelineGraphicSearch" type="search">
          <label for="timelineGraphicCategory">Graphic category</label>
          <select id="timelineGraphicCategory">
            <option value="">All categories</option>
          </select>
          <label for="timelineGraphic">Graphic</label>
          <select id="timelineGraphic"></select>
          <label for="timelineGraphicPosition">Placement</label>
          <select id="timelineGraphicPosition">
            <option value="top-left">Top left</option>
            <option value="top-right">Top right</option>
            <option value="center">Center</option>
            <option value="bottom-left">Bottom left</option>
            <option value="bottom-right">Bottom right</option>
          </select>
          <label>Graphic color <input type="color" id="timelineGraphicColor" value="#e5a323"></label>
          <label>Graphic text <input id="timelineGraphicText" type="text" maxlength="60"></label>
          <div class="video-work-actions">
            <button id="applyTimelineGraphic" type="button" disabled>Apply graphic</button>
            <button id="clearTimelineGraphic" type="button" disabled>Clear graphic</button>
          </div>
          <p id="timelineGraphicStatus" role="status"></p>
        </fieldset>
        <fieldset>
          <legend>Brand kit</legend>
          <label for="timelineBrandKit">Reusable brand kit</label>
          <select id="timelineBrandKit"><option value="">Choose a brand kit</option></select>
          <button id="applyTimelineKit" type="button" disabled>Use brand kit</button>
          <button id="clearTimelineKit" type="button" hidden>Remove from timeline</button>
          <a href="{{ url_for('brand_kits_page') }}">Manage brand kits</a>
          <p id="timelineBrandSources" hidden></p>
        </fieldset>
        <fieldset>
          <legend>Templates</legend>
          <label for="timelineTemplateSearch">Find a template</label>
          <input id="timelineTemplateSearch" type="search">
          <label for="timelineTemplateCategory">Template category</label>
          <select id="timelineTemplateCategory">
            <option value="">All categories</option>
          </select>
          <label for="timelineTemplateRatio">Template shape</label>
          <select id="timelineTemplateRatio">
            <option value="">Any shape</option>
            <option value="16:9" selected>Landscape (16:9)</option>
            <option value="1:1">Square (1:1)</option>
            <option value="9:16">Portrait (9:16)</option>
          </select>
          <label for="timelineTemplate">Template</label>
          <select id="timelineTemplate" disabled>
            <option value="">Choose a template</option>
          </select>
          <p id="timelineTemplateDescription" aria-live="polite"></p>
          <figure>
            <figcaption>Opening scene</figcaption>
            <div id="timelineTemplateOpening"></div>
          </figure>
          <figure>
            <figcaption>Closing scene</figcaption>
            <div id="timelineTemplateClosing"></div>
          </figure>
          <div class="video-work-actions">
            <button id="timelineTemplateApply" type="button" disabled>Use both scenes</button>
            <button id="timelineTemplateInsertOpening" type="button" disabled>Insert opening scene</button>
            <button id="timelineTemplateInsertClosing" type="button" disabled>Insert closing scene</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Library media</legend>
          <label>Find video <input id="timelineSearch" type="search"></label>
          <label for="timelineVideo">Add video</label>
          <select id="timelineVideo"></select>
          <button id="appendTimeline" type="button">Add to timeline</button>
          <form id="timelineUpload">
            <label>Upload a clip <input id="timelineFile" type="file" accept=".mp4,.mov,.webm,.mkv" required></label>
            <button id="uploadTimeline" type="submit">Upload and add clip</button>
          </form>
          <button id="recordTimeline" type="button">Record a clip</button>
        </fieldset>
        <fieldset>
          <legend>Background audio</legend>
          <label for="timelineMusic">Audio work</label>
          <select id="timelineMusic"><option value="">None</option></select>
          <label>Start at audio time (seconds) <input id="timelineMusicStart" type="number" step="0.001" min="0"></label>
          <label>Volume (%) <input id="timelineMusicGain" type="number" min="0" max="100" step="1"></label>
          <button id="setTimelineMusic" type="button">Apply background audio</button>
        </fieldset>
      </aside>
    </div>
    <section aria-labelledby="timelineHeading">
      <h2 id="timelineHeading">Video track</h2>
      <p id="timelineDuration"></p>
      <ol id="timelineClips"></ol>
    </section>
    <section id="timelineTranscript" aria-labelledby="timelineTranscriptHeading" hidden>
      <h2 id="timelineTranscriptHeading">Transcript of the selected source</h2>
      <label>Subtitle track <select id="timelineSubtitle"></select></label>
      <label>Find text <input id="timelineTextSearch" type="search"></label>
      <ul id="timelineCues" class="trim-cues"></ul>
    </section>
  </main>
  <dialog id="timelineRecordDialog" aria-labelledby="timelineRecordHeading">
    <h2 id="timelineRecordHeading">Record a clip</h2>
    <button id="closeTimelineRecorder" type="button">Close recorder</button>
    <iframe id="timelineRecorder" title="Record Studio" allow="camera 'self'; microphone 'self'; display-capture 'self'"></iframe>
  </dialog>
  <script type="module" src="/static/ui/timeline_studio.js"></script>
</body>
</html>
