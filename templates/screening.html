<!doctype html><html lang="en"><meta charset="utf-8"><link rel="stylesheet" href="/static/cueporch.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><video controls
            preload="metadata" src="{{src}}">{% for track in tracks %}<track kind="captions" srclang="{{track.language}}"
            label="{{track.language}}" src="{{base}}/caption/{{loop.index0}}">{% endfor %}</video><p role="status" id="message"></p>
            <script>const v=document.querySelector('video');let stopped=false;
            function closeScreen(){if(stopped)return;stopped=true;v.pause();v.removeAttribute('src');v.load();
            message.textContent='This screening has closed.';}
            const expires=setTimeout(closeScreen,{{remaining}}*1000);
            async function check(){if(stopped)return;try{let r=await fetch(location.pathname+'/status',
            {cache:'no-store',signal:AbortSignal.timeout(2000)});if(!r.ok){closeScreen();return;}}
            catch{closeScreen();return;}setTimeout(check,1000);}check();</script></html>
