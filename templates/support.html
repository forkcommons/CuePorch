<!doctype html><html lang="en"><meta charset="utf-8"><link rel="stylesheet" href="/static/cueporch.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support and appeals</title><h1>Support and appeals</h1>
        <p>{{ contact }} {{ hours }}</p>{% if escalation %}<p>Escalations · {{ escalation }}</p>{% endif %}{% if recovery %}<p>Service recovery · {{ recovery }}</p>{% endif %}<form id="report"><label>Work ID <input id="work" value="{{ work }}" required></label>
        <label>Describe the problem or provide context <textarea id="details" required></textarea></label><button>Open case</button></form>
        <h2>Existing case</h2><label>Case ID <input id="caseId"></label><label>Case or operator credential <input type="password" id="key"></label>
        <button id="listCases">Load operator inbox</button><ul id="caseList"></ul><button id="readCase">View history</button><label>Message <textarea id="note"></textarea></label>
        <select id="kind"><option>context</option><option>appeal</option><option>decision</option><option>restoration</option></select>
        <label><input type="checkbox" id="suspend">Suspend affected screenings on decision</label>
        <button id="reply">Record response</button><pre id="result" role="status"></pre><script>
        const headers=()=>({Authorization:'Bearer '+key.value,'Content-Type':'application/json'});
        report.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/works/'+encodeURIComponent(work.value)+'/complaints',
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({details:details.value})});
        if(!r.ok){result.textContent='Case creation failed';return}const data=await r.json();caseId.value=data.case;key.value=data.case_key;
        result.textContent='Save your case ID and private case key: '+data.case+' '+data.case_key;};
        const url=()=>'/api/cases/'+encodeURIComponent(caseId.value);readCase.onclick=async()=>{const r=await fetch(url(),{headers:headers()});
        result.textContent=r.ok?JSON.stringify(await r.json(),null,2):'Access denied';};
        reply.onclick=async()=>{const r=await fetch(url(),{method:'POST',headers:headers(),body:JSON.stringify({kind:kind.value,
        details:note.value,suspend_screenings:suspend.checked})});if(r.ok)readCase.click();else result.textContent='Response failed';};
        listCases.onclick=async()=>{const r=await fetch('/api/cases',{headers:headers()});if(!r.ok){result.textContent='Operator access required';return;}
caseList.replaceChildren();for(const c of await r.json()){let li=document.createElement('li'),b=document.createElement('button');
b.textContent=c.work+' · '+c.id;b.onclick=()=>{caseId.value=c.id;readCase.click();};li.append(b);caseList.append(li);}};</script></html>
