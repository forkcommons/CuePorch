<!doctype html><html lang="en"><meta charset="utf-8"><link rel="stylesheet" href="/static/cueporch.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support and appeals</title><h1>Support and appeals</h1>
        <p>{{ contact }} {{ hours }}</p>{% if escalation %}<p>Escalations · {{ escalation }}</p>{% endif %}{% if recovery %}<p>Service recovery · {{ recovery }}</p>{% endif %}<form id="report"><label>Work ID <input id="work" value="{{ work }}" required></label>
        <label>Describe the problem or provide context <textarea id="details" required></textarea></label><button>Open case</button></form>
        <h2>Existing case</h2><label>Case ID <input id="caseId"></label><label>Case or operator credential <input type="password" id="key"></label>
        <button id="listCases">Load operator inbox</button><ul id="caseList"></ul><button id="readCase">View history</button><label>Message <textarea id="note"></textarea></label>
        <select id="kind"><option>context</option><option>appeal</option><option>decision</option><option>restoration</option></select>
        <label><input type="checkbox" id="suspend">Suspend affected screenings on decision</label>
        <button id="reply">Record response</button><pre id="result" role="status"></pre><script type="module" src="/static/ui/support.js"></script></html>
