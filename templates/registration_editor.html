    <form id="registrationEditor" hidden>
      <h2>Registration</h2>
      <p id="registrationProtected" hidden>This video is a designated public record and remains open for viewing.</p>
      <label>Saved registration preset <select name="preset"><option value="">Choose a preset</option></select></label>
      <label><input type="checkbox" name="enabled"> Require registration before playback</label>
      <label>Form heading <input name="heading" maxlength="80" required></label>
      <label>Form description <textarea name="description" maxlength="1000" rows="3"></textarea></label>
      <label>Privacy policy URL <input type="url" name="privacy_url" maxlength="2048"></label>
      <label>Form layout <select name="layout"><option value="single">One step</option><option value="steps">Two steps</option></select></label>
      <label>First name field <select name="first_name">
        <option value="off">Off</option><option value="optional">Optional</option><option value="required">Required</option>
      </select></label>
      <label>Last name field <select name="last_name">
        <option value="off">Off</option><option value="optional">Optional</option><option value="required">Required</option>
      </select></label>
      <label><input type="checkbox" name="collect_utm"> Save UTM campaign fields</label>
      {% if event_registration_editor %}
      <label><input type="checkbox" name="attendance_analytics"> Offer attendees a choice to share watch time</label>
      {% endif %}
      <fieldset>
        <legend>Custom fields</legend>
        <ol id="registrationFields"></ol>
        <button type="button" id="addRegistrationField">Add field</button>
      </fieldset>
      <fieldset>
        <legend>Form translations</legend>
        <label>Language to edit <select name="translation_language">
          {% for code, name in registration_languages.items() if code != 'en' %}
          <option value="{{ code }}" lang="{{ code }}">{{ name }}</option>
          {% endfor %}
        </select></label>
        <label><input type="checkbox" name="translation_enabled"> Show this language to viewers</label>
        <div id="registrationTranslation" hidden>
          <label>Translated heading <input name="translated_heading" maxlength="80"></label>
          <label>Translated description <textarea name="translated_description" rows="3" maxlength="1000"></textarea></label>
          <div id="registrationTranslatedFields"></div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Registration appearance</legend>
        <label>Form alignment <select name="alignment"><option value="start">Left</option><option value="center">Center</option><option value="end">Right</option></select></label>
        <label>Registration logo <input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></label>
        <button type="button" data-clear-image="logo" hidden>Remove logo</button>
        <label>Registration background image <input type="file" name="background_image" accept="image/png,image/jpeg,image/webp"></label>
        <button type="button" data-clear-image="background_image" hidden>Remove background image</button>
        <label>Background color <input type="color" name="background"></label>
        <label>Overlay color <input type="color" name="overlay"></label>
        <label>Overlay opacity (%) <input type="number" name="opacity" min="0" max="100" step="1" required></label>
        <label>Preview screen <select name="preview_screen"><option value="form">Registration form</option><option value="sign-on">Already registered</option></select></label>
        <label>Preview language <select name="preview_language"><option value="en">English</option></select></label>
        <label>Form preview device <select name="preview_size"><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select></label>
        <button type="button" id="showRegistrationPreview">Preview registration</button>
        <div class="registration-preview-container">
          <iframe id="registrationPreview" title="Registration preview" class="registration-preview" sandbox hidden></iframe>
        </div>
      </fieldset>
      <label>Save as registration preset <input name="preset_name" maxlength="80"></label>
      <button type="submit">Save registration</button>
      <p id="registrationStatus" role="status"></p>
      <section aria-labelledby="registrantHeading">
        <h3 id="registrantHeading">Recent registrants</h3>
        <table><thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Registered</th></tr></thead>
          <tbody id="registrantRows"></tbody>
        </table>
        <button type="button" id="registrationExport">Download registrants CSV</button>
      </section>
    </form>
  <template id="registrationField">
    <li>
      <label>Field type <select name="kind">
        <option value="text">Text</option><option value="select">Dropdown</option>
        <option value="checkbox">Checkbox</option><option value="description">Description</option><option value="hidden">Hidden</option>
      </select></label>
      <label>Field label <input name="label" maxlength="240" required></label>
      <label data-field-options hidden>Choices, one per line <textarea name="options" rows="3"></textarea></label>
      <div data-field-hidden hidden>
        <label>URL parameter after reg_ <input name="parameter" maxlength="40" pattern="[a-z][a-z0-9_]{0,39}"></label>
        <label>Default answer <input name="default_value" maxlength="250"></label>
      </div>
      <label data-field-required><input type="checkbox" name="required"> Required field</label>
      <label data-field-link hidden>Terms link <input type="url" name="link" maxlength="2048"></label>
      <button type="button" data-remove-field>Remove field</button>
    </li>
  </template>
