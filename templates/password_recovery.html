<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · CuePorch</title>
  <link rel="stylesheet" href="/static/cueporch.css">
</head>
<body>
  <nav><a href="{{ account_page }}">Return to sign in</a></nav>
  <main id="passwordRecovery" class="viewer-account" data-scope="{{ scope }}" data-mail="{{ 'yes' if available else 'no' }}">
    <h1>Reset password</h1>
    <p id="passwordRecoveryStatus" role="status"></p>
    <form id="requestPasswordReset" method="post" hidden>
      <label>Email <input type="email" name="email" autocomplete="username" maxlength="254" required></label>
      <button type="submit">Send reset link</button>
    </form>
    <form id="choosePassword" method="post" hidden>
      <label>New password <input type="password" name="password" autocomplete="new-password" minlength="12"
                                 maxlength="256" required></label>
      <label>Confirm new password <input type="password" name="confirm" autocomplete="new-password" minlength="12"
                                         maxlength="256" required></label>
      {% include "sign_in_factor.html" %}
      <button type="submit">Change password</button>
    </form>
  </main>
  <script type="module" src="/static/ui/password_recovery.js"></script>
</body>
</html>
