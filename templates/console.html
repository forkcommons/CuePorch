<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/static/cueporch.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CuePorch operator</title>
<h1>{{ institution }} &middot; CuePorch</h1><p><a href="/operator/migration">Move from Vimeo</a></p><label>Operator credential <input id="key" type="password"></label>
<p><a href="/operator/library">Manage library and embeds</a> · <a href="/operator/exhibitions">Exhibitions</a> · <a href="/support">Support and appeals</a> · <a href="/submit">Submit a work</a></p>
<button id="load">Load settings and review queue</button><div id="settings"></div><h2>Awaiting approval</h2><div id="queue"></div><p role="status" id="result"></p>
<script>
const call=(url,opt={})=>fetch(url,{...opt,headers:{Authorization:'Bearer '+key.value,'Content-Type':'application/json'}});
load.onclick=async()=>{const response=await call('/api/policy');if(!response.ok){result.textContent='Access denied';return}
settings.replaceChildren();for(const [step,required] of Object.entries(await response.json())){
 const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=required;
 input.onchange=async()=>{let r=await call('/api/policy/'+step,{method:'PUT',body:JSON.stringify({required:input.checked})});
 result.textContent=r.ok?'Saved':'Unable to save';if(!r.ok)input.checked=!input.checked;};
 label.append(input,document.createTextNode('Require approval for '+step));settings.append(label,document.createElement('br'));}
 queue.replaceChildren();for(const job of await (await call('/api/actions')).json()){
 const line=document.createElement('p');line.append(document.createTextNode(job.step+' '+job.payload+' '));
 for(const decision of ['approve','reject']){const button=document.createElement('button');button.textContent=decision;
 button.onclick=async()=>{const r=await call('/api/actions/'+job.id+'/decision',{method:'POST',body:JSON.stringify({decision})});
 if(r.ok)load.click();else result.textContent='Decision failed';};line.append(button);}queue.append(line);}};
</script>
