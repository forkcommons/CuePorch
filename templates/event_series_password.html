<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ labels.protected }} · CuePorch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='cueporch.css') }}">
</head>
<body class="live-event-page">
  <main id="eventLobby">
    <h1>{{ labels.protected }}</h1>
    <form method="post">
      {% if incorrect %}<p role="alert">{{ labels.incorrect }}</p>{% endif %}
      <label>{{ labels.password }} <input type="password" name="password" maxlength="256" autocomplete="current-password" required></label>
      <button type="submit">{{ labels.unlock }}</button>
    </form>
  </main>
</body>
</html>
