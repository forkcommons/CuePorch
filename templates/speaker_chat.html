<section id="speakerPrivateChat" aria-labelledby="speakerPrivateChatHeading" hidden>
  <h3 id="speakerPrivateChatHeading">Speaker chat</h3>
  <ol class="event-messages" aria-label="Private speaker messages"></ol>
  <form>
    <label>Message to speakers <input name="message" maxlength="400" required></label>
    <button type="submit">Send to speakers</button>
  </form>
  <p role="status"></p>
</section>
