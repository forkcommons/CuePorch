services:
  postgres:
    image: postgres:17-alpine@sha256:cdef2be34fbbd163d0d633177c02d228c6c47937b95fdffe1eefb91914dfd47f
    environment:
      POSTGRES_DB: peertube
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?run bootstrap}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U peertube"]
      start_period: 8m
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    volumes:
      - redis:/data
  peertube:
    image: chocobozzz/peertube:v8.3.2@sha256:350d5d55d45dc6a81e34f2dc996c7a22ec6b43793b43597972c521c477c63da8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${HTTP_PORT:-19000}:9000"
      - "127.0.0.1:${RTMP_PORT:-11935}:1935"
    environment:
      PEERTUBE_WEBSERVER_HOSTNAME: ${PUBLIC_HOST:-localhost}
      PEERTUBE_WEBSERVER_PORT: ${PUBLIC_PORT:-19000}
      PEERTUBE_WEBSERVER_HTTPS: ${PUBLIC_HTTPS:-false}
      PEERTUBE_SECRET: ${INSTANCE_SECRET:?run bootstrap}
      PT_INITIAL_ROOT_PASSWORD: ${OPERATOR_PASSWORD:?run bootstrap}
      PEERTUBE_DB_HOSTNAME: postgres
      PEERTUBE_DB_NAME: peertube
      PEERTUBE_DB_USERNAME: peertube
      PEERTUBE_DB_PASSWORD: ${DATABASE_PASSWORD}
      PEERTUBE_DB_SSL: "false"
      PEERTUBE_REDIS_HOSTNAME: redis
      PEERTUBE_ADMIN_EMAIL: operator@example.invalid
      PEERTUBE_TRANSCODING_ENABLED: "true"
      PEERTUBE_TRANSCODING_THREADS: "2"
      PEERTUBE_TRANSCODING_HLS_ENABLED: "true"
      PEERTUBE_LIVE_ENABLED: "true"
      PEERTUBE_LIVE_ALLOW_REPLAY: "true"
    volumes:
      - media:/data
      - config:/config
volumes:
  database:
  redis:
  media:
  config:

